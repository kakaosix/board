<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>AI 필터링 게시판</title>
    <style>
        body { font-family: Arial, sans-serif; max-width: 600px; margin: 40px auto; padding: 0 20px; }
        .form-group { margin-bottom: 15px; }
        input[type="text"], textarea { width: 100%; padding: 8px; box-sizing: border-box; }
        button { padding: 10px 15px; background: #007BFF; color: white; border: none; cursor: pointer; }
        button.delete-btn { background: #DC3545; padding: 5px 10px; font-size: 12px; float: right;}
        .post-card { border: 1px solid #ddd; padding: 15px; margin-top: 15px; border-radius: 4px; }
        .post-card h3 { margin: 0 0 10px 0; }
    </style>
</head>
<body>

    <h2>📝 풀스택 + AI 게시판</h2>
    
    <!-- 게시글 작성 폼 -->
    <div class="form-group">
        <input type="text" id="title" placeholder="제목을 입력하세요">
    </div>
    <div class="form-group">
        <textarea id="content" rows="4" placeholder="내용을 입력하세요 (테스트용 악플: '진짜 최악이다 쓰레기 같아')"></textarea>
    </div>
    <button onclick="submitPost()">게시글 등록</button>

    <hr>

    <h2>📋 게시글 목록</h2>
    <div id="posts-list"></div>

    <script>
        // 페이지 로드 시 게시글 가져오기
        document.addEventListener("DOMContentLoaded", loadPosts);

        // [READ] 게시글 목록 요청
        async function loadPosts() {
            const response = await fetch('/api/posts');
            const posts = await response.json();
            const listDiv = document.getElementById('posts-list');
            listDiv.innerHTML = '';

            if(posts.length === 0) {
                listDiv.innerHTML = '<p>등록된 게시글이 없습니다.</p>';
                return;
            }

            posts.forEach(post => {
                const card = document.createElement('div');
                card.className = 'post-card';
                card.innerHTML = `
                    <button class="delete-btn" onclick="deletePost(${post.id})">삭제</button>
                    <h3>${post.title} (${post.regdate})</h3>
                    <p>${post.content}</p>
                `;
                listDiv.appendChild(card);
            });
        }

        // [CREATE] 게시글 등록 및 AI 필터링 검증 확인
        async function submitPost() {
            const title = document.getElementById('title').value;
            const content = document.getElementById('content').value;

            const response = await fetch('/api/posts', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ title, content })
            });
            const result = await response.json();

            alert(result.message); // AI 차단 메시지 또는 성공 메시지 출력

            if (result.success) {
                document.getElementById('title').value = '';
                document.getElementById('content').value = '';
                loadPosts();
            }
        }

        // [DELETE] 게시글 삭제
        async function deletePost(postId) {
            if(!confirm("정말 삭제하시겠습니까?")) return;
            const response = await fetch(`/api/posts/${postId}`, { method: 'DELETE' });
            const result = await response.json();
            alert(result.message);
            loadPosts();
        }
    </script>
</body>
</html>
